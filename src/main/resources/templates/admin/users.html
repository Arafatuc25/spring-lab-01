<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Администрирование</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #eaf1f8;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Администрирование</h1>

<p>
    Вы вошли как:
    <strong th:text="${currentUsername}">admin</strong>
</p>

<p>
    <a th:href="@{/books}">Перейти к каталогу книг</a>
</p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Логин</th>
        <th>Активен</th>
        <th>Роли</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.enabled}"></td>
        <td th:text="${user.roles}"></td>
    </tr>
    </tbody>
</table>

<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

</body>
</html>
